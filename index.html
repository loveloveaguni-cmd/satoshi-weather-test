<style>
body {

}

.container {
  padding: 10px;
}

.header {
  display: flex;
  justify-content: space-between;
  font-size: 24px;
  color: #aaa;
}

.weather {
  display: flex;
  align-items: center;

}

.icon {

}

.temp {

}

.details {

.day {

}ß.garbage {

  font-size: 28px;

}

<style id="wakeLockStyles">

<script id="wakeLockScript">
// Weatherの通信処理と独立した画面常時点灯コントロール。
(function () {
  'use strict';
  var PREF_KEY = 'satoshi-weather-screen-awake-enabled';
  var toggle = document.getElementById('wakeLockToggle');
  var retry = document.getElementById('wakeLockRetry');
  var status = document.getElementById('wakeLockStatus');
  var detail = document.getElementById('wakeLockDetail');
  var environment = document.getElementById('wakeLockEnvironment');
  var log = document.getElementById('wakeLockLog');
  var enabled = true, sentinel = null, busy = false, rerun = false;
  var pageActive = true, lastMessage = '', history = [];
  var secure = window.isSecureContext === true;
  var supported = !!(navigator.wakeLock && typeof navigator.wakeLock.request === 'function');
  try { enabled = localStorage.getItem(PREF_KEY) !== 'off'; } catch (ignore) {}
  toggle.checked = enabled;

  function visible() { return document.visibilityState === 'visible' && pageActive; }
  function shouldHold() { return enabled && secure && supported && visible(); }
  function refreshControls() {
    retry.disabled = busy || !secure || !supported || (!enabled && (!sentinel || sentinel.released));
    environment.textContent = '安全な接続: ' + (secure ? 'はい' : 'いいえ') +
      ' / API対応: ' + (supported ? 'はい' : 'いいえ') +
      ' / 画面: ' + document.visibilityState + ' / 接続方式: ' + window.location.protocol;
  }
  function show(state, message) {
    status.textContent = state;
    detail.textContent = message;
    refreshControls();
    var entry = state + '：' + message;
    if (entry !== lastMessage) {
      lastMessage = entry;
      history.push(new Date().toLocaleTimeString() + ' ' + entry);
      if (history.length > 10) history.shift();
      log.textContent = history.join('\n');
      if (window.console && typeof window.console.info === 'function') window.console.info('[Wake Lock] ' + entry);
    }
  }
  function showIdle() {
    if (!enabled) show('オフ', '通常の画面消灯設定に従います。');
    else if (!secure) show('利用条件を満たしていません', 'HTTPSで開いてください。別端末からMacのIPアドレスへHTTP接続した場合は利用できません。');
    else if (!supported) show('このブラウザは未対応です', '常時点灯は要求できません。天気表示はそのまま利用できます。');
    else if (!visible()) show('一時停止中', '画面を離れています。戻ったときに常時点灯を再要求します。');
  }
  function errorText(error) {
    return (error && error.name ? error.name : 'Error') + ': ' +
      (error && error.message ? error.message : String(error));
  }
  async function reconcile(reason) {
    // 取得待ちの間のオン・オフや復帰は最後の状態にまとめ、二重取得しない。
    if (busy) { rerun = true; return; }
    busy = true;
    refreshControls();
    try {
      if (!shouldHold()) {
        if (sentinel && !sentinel.released) {
          var previous = sentinel;
          await previous.release();
          if (sentinel === previous) sentinel = null;
        }
        showIdle();
        return;
      }
      if (sentinel && !sentinel.released) {
        show('取得中（常時点灯）', '画面の自動減光・スリープを防ぐよう要求しています。');
        return;
      }
      show('要求中', reason + '：常時点灯を要求しています。');
      var acquired = await navigator.wakeLock.request('screen');
      sentinel = acquired;
      acquired.addEventListener('release', function () {
        if (sentinel !== acquired) return;
        sentinel = null;
        if (!shouldHold()) showIdle();
        else show('解除されました', '端末またはブラウザが要求を解除しました。電源状態などを確認し「再試行」を押してください。画面復帰時にも再要求します。');
      });
      // 要求待ちの間にオフ・非表示になった場合も、取得した要求を残さない。
      if (!shouldHold()) {
        await acquired.release();
        if (sentinel === acquired) sentinel = null;
        showIdle();
      } else if (acquired.released) {
        sentinel = null;
        show('解除されました', '取得直後に解除されました。「再試行」で再要求できます。');
      } else {
        show('取得中（常時点灯）', '画面の自動減光・スリープを防ぐよう要求しています。');
      }
    } catch (error) {
      show('取得・解除に失敗しました', errorText(error) + '。天気表示は継続します。条件を確認して「再試行」を押してください。');
    } finally {
      busy = false;
      refreshControls();
      if (rerun) { rerun = false; reconcile('状態変更後'); }
    }
  }
  toggle.addEventListener('change', function () {
    enabled = toggle.checked;
    try { localStorage.setItem(PREF_KEY, enabled ? 'on' : 'off'); } catch (ignore) {}
    reconcile('切り替え');
  });
  retry.addEventListener('click', function () { reconcile('手動再試行'); });
